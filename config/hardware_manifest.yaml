  sku: "DEV-15025"
  mcu: "Nordic Semiconductor nRF52840 (ARM Cortex-M4F @ 64MHz)"
  flash_bytes: 1048576
  sram_bytes: 262144
  bootloader: "Adafruit nRF52 Bootloader (UF2 / CDC)"
  fqbn: "adafruit:nrf52:sparkfunnrf52840mini"
  status: "BOARD_PACKAGE_VERIFIED"

